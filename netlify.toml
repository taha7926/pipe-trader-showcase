# Netlify configuration for Mufaddal Traders (Vite + React SPA)

[build]
  command   = "npm run build"
  publish   = "dist"

# SPA routing — redirect all routes to index.html so React Router works
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Cache static assets (images, PDFs, fonts) for 1 year
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/catalogs/*"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/pdfs/*"
  [headers.values]
    Cache-Control = "no-cache"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
